name: Transformer checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python demo.py --steps 2 --tokens 8
      - name: Train-only tokenizer and held-out evaluation smoke test
        run: >-
          python evaluate.py --corpus tests/fixtures/evaluation.txt
          --steps 2 --batch-size 2 --seeds 7 --device cpu
          --embedding-dim 16 --heads 2 --layers 1 --context 8
          --output-dir evaluation-ci
